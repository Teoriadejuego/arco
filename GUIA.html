<main id="lesson"><div class="lesson-top"><p id="counter" role="status" aria-live="polite"></p><button id="notes-toggle" type="button" aria-expanded="false" aria-controls="speaker-notes">Mostrar notas</button></div><article aria-labelledby="slide-title"><p class="eyebrow">De la pregunta al informe</p><h1 id="slide-title" tabindex="-1"></h1><div id="slide-copy"></div><a id="slide-action" class="primary" href="index.html" target="_blank" rel="noopener">Abrir herramienta <span aria-hidden="true">↗</span></a></article><aside id="speaker-notes" hidden aria-label="Notas para presentar"><h2>Para quien presenta</h2><p id="note-copy"></p></aside><nav class="step-controls" aria-label="Pasar pantalla"><button id="previous" type="button">← Anterior</button><span class="keyboard-hint">Flechas ← → · Inicio · Fin</span><button id="next" type="button">Siguiente →</button></nav><details id="outline"><summary>Elegir una de las doce pantallas</summary><nav id="slide-index" aria-label="Índice de la guía"></nav></details><p id="guide-error" role="alert" hidden></p></main><footer>Guía local · 0.11.2-web.1 · No contiene datos ni accesos reales.</footer><script id="guide-data" type="application/json">[{"id":"proposito","title":"Escuchar al grupo. Leer con contexto.","body":["ARCO organiza respuestas y relaciones para que un equipo pueda revisarlas.","El informe describe los datos disponibles. La interpretación y las decisiones corresponden a las personas profesionales responsables."],"note":"Presenta una necesidad concreta de la organización. Evita prometer diagnósticos o efectos de una intervención. En esta guía no se abren archivos privados.","action":"Ver un informe de ejemplo","href":"CLAVE.html#ejemplo-esencial"},{"id":"piezas","title":"Tres piezas, un recorrido.","body":["SALMER recoge respuestas. DOVELA prepara el informe y sus accesos. CLAVE permite consultarlo.","La demo recorre las tres piezas con datos ficticios. El servicio de encuestas de SALMER se instala y administra por separado."],"note":"Distingue la demostración HTML de SALMER del servidor que conserva respuestas. No digas que la página pública ya recoge campañas reales.","action":"Abrir la demo guiada","href":"DEMO.html"},{"id":"acceso","title":"Cada persona, dentro de su ámbito.","body":["Diseño prepara los cuestionarios. Gestión organiza participantes y campañas. Participación responde con su acceso.","Los accesos de demostración sirven solo para las pruebas incluidas."],"note":"Para enseñar el servidor local, utiliza una campaña sintética. No proyectes contraseñas o el censo de una organización real.","action":"Ver SALMER de demostración","href":"SALMER.html"},{"id":"encuesta","title":"Una respuesta no siempre es un número.","body":["Una pregunta puede recoger una escala, una categoría, texto o relaciones entre personas.","Cero, «nadie», una opción no elegida y una pregunta sin responder tienen significados distintos."],"note":"Usa la lista de amistades de la demo. Explica lo que solicita la pregunta, sin deducir que una omisión significa ausencia de dificultad.","action":"Probar las preguntas","href":"SALMER.html"},{"id":"guardado","title":"Confirmar antes de dar por guardado.","body":["En SALMER con servidor, el estado de guardado confirma lo que se ha recibido. Una conexión interrumpida requiere revisar el mensaje y reintentar.","La demostración HTML guarda su recorrido solo durante la sesión; recargarla lo reinicia."],"note":"En una prueba del servidor puedes salir y volver a una respuesta confirmada. No presentes esa recuperación como disponible en DOVELA o CLAVE.","action":"Continuar el recorrido de ejemplo","href":"DEMO.html"},{"id":"origen","title":"Conservar el origen y el periodo.","body":["La exportación de SALMER identifica cuestionario, campaña, ola y estado de las respuestas.","El centro puede preparar su entrega nominal. La salida por códigos para análisis sigue las restricciones y la revisión de textos previstas."],"note":"No equipares códigos con anonimato absoluto. La plantilla debe corresponder al cuestionario y cada ola conservar su periodo.","action":"Consultar el caso SALMER","href":"CLAVE-SALMER.html"},{"id":"cargar","title":"Cargar datos y plantilla.","body":["DOVELA admite Excel y una plantilla .dovela. La plantilla decide variables, etiquetas y tratamientos.","Puedes reunir hasta diez archivos del mismo periodo o consultar hasta tres olas. Los archivos propios requieren la licencia configurada; la demo no."],"note":"Usa «Cargar demo» para la presentación. Cargar una plantilla no supone que sea compatible con cualquier encuesta.","action":"Abrir DOVELA","href":"DOVELA.html"},{"id":"revisar","title":"Revisar antes de entregar.","body":["Comprueba archivos, hojas, periodos y ámbitos. Distingue avisos de problemas que impiden continuar.","Genera el informe y abre su vista previa. La personalización avanzada es opcional."],"note":"Enseña un aviso real del ejemplo y su consecuencia. No cambies las reglas para que el resultado parezca más favorable.","action":"Preparar un ejemplo","href":"DOVELA.html"},{"id":"perfiles","title":"Preparar accesos concretos.","body":["Elige destinatario, ámbito y permiso PDF. DOVELA separa el contenido de cada ámbito antes de protegerlo.","Las nuevas frases de acceso tienen ocho palabras. La marca de agua muestra un identificador parcial; no verifica por sí sola a la persona que lo utiliza."],"note":"No uses credenciales reales en la proyección. El permiso PDF está denegado por defecto. El PDF usa como contraseña el usuario exacto; esa clave es predecible.","action":"Ver el paso de accesos en la demo","href":"DEMO.html"},{"id":"entregar","title":"Informe y accesos, por separado.","body":["Descarga el .arco y las credenciales por separado. «Descarga iniciada» no confirma que el archivo esté guardado.","Comprueba el archivo descargado y los accesos preparados antes de terminar."],"note":"Explica la comprobación de entrega. DOVELA mantiene el trabajo en memoria; cerrar o recargar no lo recupera automáticamente.","action":"Abrir DOVELA","href":"DOVELA.html"},{"id":"consultar","title":"Del conjunto a cada persona.","body":["En CLAVE, revisa primero el periodo y el ámbito. Después consulta las fichas, listas y relaciones.","Usa «Ver más» para ampliar. Las redes tienen vista circular, comunidades y alternativa en tabla; las cifras conservan sus denominadores."],"note":"Abre el informe esencial, entra en una lista y vuelve desde una ficha. Explica que comparar olas requiere revisar su comparabilidad y no demuestra causalidad.","action":"Explorar CLAVE","href":"CLAVE.html#ejemplo-esencial"},{"id":"cerrar","title":"Cerrar y acordar el siguiente paso.","body":["Cierra la consulta al terminar y conserva las descargas según el procedimiento de la organización.","Para una primera lectura: ¿qué observamos, qué falta conocer y qué conviene revisar con el equipo?"],"note":"Cerrar limpia la vista y las claves en memoria; no borra los archivos descargados ni otras pestañas. La gestión compartida de actuaciones queda fuera de esta edición.","action":"Volver a ARCO","href":"index.html"}]</script><script src="assets/shared.60e89c7a1b1dbfaa.js" integrity="sha256-YOicehsdv6rwtHiEpXcQbTR9VCeIu7iNf4Xw6JYFmmc=" crossorigin="anonymous" defer></script></body></html>
